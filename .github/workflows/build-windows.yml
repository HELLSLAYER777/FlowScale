# Reusable Windows build used by CI and the Release workflow.
# Produces a runnable zip artifact: FlowScale.exe + shaders\ + models\ + docs.
#
# Robust against runner-image churn (e.g. windows-latest moving to VS 2026):
#  - vcpkg is our own clone pinned to VCPKG_COMMIT (VCPKG_ROOT env override),
#    never the VS-bundled copy the image may ship;
#  - the build uses Ninja (installed below if the image lacks it), so no
#    dependence on which Visual Studio generator is available;
#  - the same commit is the manifest's builtin-baseline (vcpkg.json).
name: build-windows (reusable)

on:
  workflow_call:
    inputs:
      neural:
        description: "Build the ONNX Runtime neural variant"
        type: boolean
        default: false
      artifact_name:
        description: "Artifact / zip base name"
        type: string
        required: true
      # Must match the version pinned in scripts/fetch-onnxruntime.ps1
      onnxruntime_version:
        description: "Prebuilt ONNX Runtime version"
        type: string
        default: "1.30.1"

env:
  # Keep in sync with "builtin-baseline" in vcpkg.json.
  VCPKG_COMMIT: 520c3b781ac2abf391887d286d569f74ae6bf752

jobs:
  build:
    name: ${{ inputs.neural && 'win-x64 neural' || 'win-x64 standard' }}
    runs-on: windows-latest
    env:
      # Our pinned clone, not the VS-bundled vcpkg from the runner image.
      # (Job-level env may only use github/inputs/etc -- no `runner` context.)
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg-tool
      # Speeds up vcpkg dependency installs between runs (nlohmann-json).
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bcache
      ORT_VERSION: ${{ inputs.onnxruntime_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore pinned vcpkg clone
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-tool
          key: vcpkg-tool-${{ env.VCPKG_COMMIT }}

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-bcache
          key: vcpkg-x64-windows-${{ hashFiles('vcpkg.json') }}-v2

      - name: Restore ONNX Runtime download cache
        if: ${{ inputs.neural }}
        uses: actions/cache@v4
        with:
          path: _deps/onnxruntime-win-x64-${{ inputs.onnxruntime_version }}
          key: onnxruntime-win-x64-${{ inputs.onnxruntime_version }}

      - name: Prepare build directories
        shell: bash
        run: mkdir -p vcpkg-bcache _deps

      - name: Install pinned vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VCPKG_ROOT/vcpkg.exe")) {
            Write-Host "Cloning vcpkg at $env:VCPKG_COMMIT"
            if (Test-Path $env:VCPKG_ROOT) { Remove-Item -Recurse -Force $env:VCPKG_ROOT }
            git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
            git -C "$env:VCPKG_ROOT" checkout $env:VCPKG_COMMIT
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          } else {
            Write-Host "vcpkg $env:VCPKG_COMMIT restored from cache"
          }

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            Write-Host "ninja not on PATH -- installing via Chocolatey"
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch prebuilt ONNX Runtime
        if: ${{ inputs.neural }}
        shell: pwsh
        run: scripts/fetch-onnxruntime.ps1 -Version $env:ORT_VERSION

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G "Ninja Multi-Config"
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DFLOWSCALE_BUILD_TESTS=ON
          -DFLOWSCALE_WITH_NEURAL=${{ inputs.neural && 'ON' || 'OFF' }}
          -DONNXRUNTIME_ROOT_DIR="$PWD/_deps/onnxruntime-win-x64-$ORT_VERSION"

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Unit tests (pacing / optical-flow math)
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke checks
        shell: bash
        run: |
          test -f build/Release/FlowScale.exe || { echo "exe missing"; exit 1; }
          test -f build/Release/shaders/scaling/fs1.hlsl || { echo "scaling shaders missing"; exit 1; }
          test -f build/Release/shaders/framegen/warp_blend.hlsl || { echo "framegen shaders missing"; exit 1; }
          test -d build/Release/models || { echo "models dir missing"; exit 1; }
          if [ "${{ inputs.neural }}" = "true" ]; then
            test -f build/Release/onnxruntime.dll || { echo "onnxruntime.dll missing"; exit 1; }
          fi

      - name: Package zip
        shell: pwsh
        run: scripts/package.ps1 -BuildDir build/Release -Name ${{ inputs.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/${{ inputs.artifact_name }}.zip
          if-no-files-found: error
          retention-days: 14
